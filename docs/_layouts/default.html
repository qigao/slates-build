<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% if page.title != site.title %}{{ page.title | escape }} · {% endif %}{{ site.title | escape }}</title>
  <meta name="description" content="{{ page.description | default: site.description | escape }}">
  <link rel="stylesheet" href="{{ '/assets/site.css' | relative_url }}">
  <script src="{{ '/assets/site.js' | relative_url }}" defer></script>
</head>
<body>
  <a class="skip" href="#main">Skip to content</a>
  <header class="site-header">
    <div class="wrap header-inner">
      <a class="brand" href="{{ '/' | relative_url }}">
        <span class="brand-mark" aria-hidden="true"></span>Slate
      </a>
      <nav class="site-nav" aria-label="Primary">
        <a href="{{ '/guide.html' | relative_url }}"{% if page.url == '/guide.html' %} aria-current="page"{% endif %}>Guide</a>
        <a href="{{ '/grammar.html' | relative_url }}"{% if page.url == '/grammar.html' %} aria-current="page"{% endif %}>Reference</a>
        <a href="https://github.com/qigao/slates-build">GitHub</a>
      </nav>
    </div>
  </header>
  <main id="main" tabindex="-1">
    {{ content }}
  </main>
  <footer class="site-footer">
    <div class="wrap footer-inner">
      <span>Slate documentation</span>
      <a href="https://github.com/qigao/slates-build/blob/main/LICENSE">Apache-2.0</a>
    </div>
  </footer>
</body>
</html>

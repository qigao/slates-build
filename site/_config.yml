title: Slate
description: Build, run, and test C and C++ projects with Slate and Ninja.
url: https://qigao.github.io
baseurl: /slates-build
repository: qigao/slates-build
vscode_extension: https://marketplace.visualstudio.com/items?itemName=slates-build.slates-extension
vscode_releases: https://github.com/qigao/slates-extension/releases/latest
markdown: kramdown
plugins:
  - jekyll-relative-links
  - jekyll-optional-front-matter
defaults:
  - scope:
      path: guide.md
    values:
      layout: document
      title: Slate guide
  - scope:
      path: grammar.md
    values:
      layout: document
      title: Slate grammar

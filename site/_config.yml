title: Slate
description: Slate is a lightweight, JSON-based build tool for C and C++ projects, powered by Ninja.
url: https://qigao.github.io
baseurl: /slates-build
repository: qigao/slates-build
vscode_extension: https://marketplace.visualstudio.com/items?itemName=slates-build.slates-extension
vscode_releases: https://github.com/qigao/slates-extension/releases/latest
openidea_releases: https://github.com/qigao/slates-openidea/releases/latest
markdown: kramdown
plugins:
  - jekyll-relative-links
  - jekyll-optional-front-matter
defaults:
  - scope:
      path: guide.md
    values:
      layout: document
      title: Slate guide
  - scope:
      path: grammar.md
    values:
      layout: document
      title: Slate grammar
  - scope:
      path: examples.md
    values:
      layout: document
      title: Slate examples
  - scope:
      path: editors.md
    values:
      layout: document
      title: Slate editor guide

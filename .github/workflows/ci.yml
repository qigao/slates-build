name: Native CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native:
    name: ${{ matrix.profile }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-2025
            profile: windows-llvm-mingw-x64
          - runner: ubuntu-24.04
            profile: linux-clang-x64
          - runner: ubuntu-24.04-arm
            profile: linux-clang-arm64
          - runner: macos-15
            profile: macos-clang-arm64
    steps:
      - uses: actions/checkout@v4
      - name: Restore pinned SDKs
        shell: pwsh
        run: ./.github/restore-sdks.ps1 -Profile '${{ matrix.profile }}'
      - name: Configure
        shell: pwsh
        run: |
          $compiler = $env:CC
          if (-not $compiler) {
            $compiler = (Get-Command clang -CommandType Application | Select-Object -First 1).Source
          }
          $options = @("-DCMAKE_C_COMPILER=$compiler")
          if ($IsMacOS) {
            $llvm = brew --prefix llvm@18
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            $archiver = Join-Path $llvm 'bin/llvm-ar'
            if (-not (Test-Path -LiteralPath $archiver -PathType Leaf)) { throw "Missing $archiver." }
            $options += "-DCMAKE_AR=$archiver"
          }
          cmake -S . -B out/ci -G Ninja -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=ON @options
      - name: Build
        run: cmake --build out/ci --parallel
      - name: Test
        run: ctest --test-dir out/ci --output-on-failure --no-tests=error

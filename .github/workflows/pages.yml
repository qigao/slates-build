name: GitHub Pages

on:
  pull_request:
    paths:
      - 'site/**'
      - 'docs/**'
      - .github/workflows/pages.yml
  push:
    branches: [main]
    paths:
      - 'site/**'
      - 'docs/**'
      - .github/workflows/pages.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Stage site and documentation
        run: |
          cp -R site _pages-source
          cp -R docs/. _pages-source/
      - name: Build with Jekyll
        uses: actions/jekyll-build-pages@v1
        with:
          source: ./_pages-source
          destination: ./_site
      - name: Verify built pages
        run: |
          test -s _site/index.html
          grep -Fq '/slates-build/examples.html#export-and-consume-an-sdk' _site/index.html
          grep -Fq 'slate install --root apps --target stats' _site/index.html
          grep -Fq 'slate run --root apps/consumer --target stats-demo' _site/index.html
          grep -Fq '<h1 id="slate-examples">Slate examples</h1>' _site/examples.html
          grep -Fq 'id="configure-the-producer"' _site/examples.html
          grep -Fq 'id="build-the-library"' _site/examples.html
          grep -Fq 'id="install-the-sdk"' _site/examples.html
          grep -Fq 'id="consume-the-sdk"' _site/examples.html
          grep -Fq '<article class="prose">' _site/examples.html
          grep -Fq '<h1 id="slate-guide">Slate guide</h1>' _site/guide.html
          grep -Fq '<h1 id="slate-grammar">Slate grammar</h1>' _site/grammar.html
          grep -Fq '<article class="prose">' _site/guide.html
          grep -Fq '<article class="prose">' _site/grammar.html
          grep -Fq '/slates-build/editors.html' _site/index.html
          grep -Fq '<h1 id="slate-editor-guide">Slate editor guide</h1>' _site/editors.html
          grep -Fq 'id="browse-the-workspace-hierarchy"' _site/editors.html
          grep -Fq '<article class="prose">' _site/editors.html
          grep -Fq 'id="compile-cuda-sources"' _site/guide.html
          grep -Fq 'id="run-an-external-test-suite"' _site/guide.html
          grep -Fq 'id="export-a-cmake-target"' _site/guide.html
      - name: Upload Pages artifact
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./_site

  deploy:
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
